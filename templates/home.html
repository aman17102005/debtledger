<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeSweep</title>
<style>
  :root {
    --ink: #f4f1e8;
    --paper: #14120f;
    --paper-raised: #1c1a16;
    --rule: #3a352c;
    --gold: #c9a15a;
    --red-ledger: #a8453a;
    --green-ledger: #6a8f5e;
    --muted: #9a9284;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Georgia", "Iowan Old Style", serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .ledger {
    width: 100%;
    max-width: 640px;
  }
  .mark {
    font-family: "Courier New", monospace;
    letter-spacing: 0.4em;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 18px;
  }
  h1 {
    font-size: 2.6rem;
    font-weight: 400;
    margin: 0 0 6px 0;
    line-height: 1.15;
  }
  h1 em {
    font-style: italic;
    color: var(--gold);
  }
  .sub {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 46ch;
    margin: 18px 0 40px 0;
  }
  form {
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 28px 0;
  }
  label {
    display: block;
    font-family: "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  input[type=text] {
    flex: 1;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 14px 16px;
    font-size: 1rem;
    font-family: "Courier New", monospace;
    border-radius: 3px;
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    background: var(--gold);
    color: #14120f;
    border: none;
    padding: 0 26px;
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    font-weight: bold;
    border-radius: 3px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .note {
    margin-top: 22px;
    font-size: 0.85rem;
    color: var(--muted);
    font-family: "Courier New", monospace;
  }
  .note b { color: var(--ink); }
</style>
</head>
<body>
  <div class="ledger">
    <div class="mark">CODESWEEP</div>
    <h1>What is your messy code <em>actually</em> costing you?</h1>
    <p class="sub">Paste a public GitHub repo. We'll read the code and its history —
    no running, no installing anything on your side — and hand back the few
    things worth fixing first.</p>
    <form action="/scan" method="post">
      <label>GITHUB REPO URL</label>
      <div class="row">
        <input type="text" name="repo_url" placeholder="https://github.com/owner/repo" required>
        <button type="submit">SCAN</button>
      </div>
      <div class="note">Works with public repos for now &middot; <b>takes 10&ndash;30 seconds</b></div>
    </form>
  </div>
</body>
</html>
