<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeSweep — Suggested Fix</title>
<style>
  :root {
    --ink: #f4f1e8; --paper: #14120f; --paper-raised: #1c1a16;
    --rule: #3a352c; --gold: #c9a15a; --green-ledger: #6a8f5e; --muted: #9a9284;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Georgia", serif; padding: 48px 20px 80px; }
  .wrap { max-width: 700px; margin: 0 auto; }
  .mark { font-family: "Courier New", monospace; letter-spacing: 0.4em; font-size: 12px; color: var(--gold); margin-bottom: 10px; }
  h1 { font-size: 2rem; font-weight: 400; margin: 0 0 24px 0; }
  .badge {
    display: inline-block; border: 1px solid var(--green-ledger); color: var(--green-ledger);
    font-family: "Courier New", monospace; font-size: 0.7rem; padding: 4px 10px; border-radius: 3px; margin-bottom: 24px;
  }
  .files { font-family: "Courier New", monospace; font-size: 0.85rem; color: var(--muted); line-height: 1.9; margin-bottom: 28px; }
  .plan {
    background: var(--paper-raised); border-left: 2px solid var(--gold);
    padding: 24px 26px; white-space: pre-wrap; line-height: 1.7; font-size: 0.95rem;
  }
  .back { display: inline-block; margin-top: 36px; color: var(--gold); font-family: "Courier New", monospace; font-size: 0.85rem; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">CODESWEEP</div>
    <h1>Suggested fix</h1>
    <div class="badge">⚠ SUGGESTION ONLY — nothing in your code has been changed</div>
    <div class="files" style="margin-bottom: 4px;">Answered by: {{ provider_label }}</div>
    <div class="files">
      Based on duplication across:<br>
      {% for f in files %}{{ f }}<br>{% endfor %}
    </div>
    <div class="plan">{{ plan }}</div>
    <a class="back" href="javascript:history.back()">&larr; back to report</a>
  </div>
</body>
</html>
